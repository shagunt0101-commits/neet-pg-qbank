<script>
const i1 = document.getElementById('i1');
const i2 = document.getElementById('i2');

  new Promise(r => { i1.onload = () => r({w:i1.naturalWidth, h:i1.naturalHeight}); i1.onerror = () => r(null); }),

]).then(([r1, r2]) => console.log('q1437_0:', r1, 'q1437_1:', r2));
